name: Test and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXPENSE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXPENSE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXPENSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXPENSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?secret NEXPENSE_KEYSTORE_BASE64 is missing or empty}"
          : "${STORE_PASSWORD:?secret NEXPENSE_STORE_PASSWORD is missing or empty}"
          : "${KEY_ALIAS:?secret NEXPENSE_KEY_ALIAS is missing or empty}"
          : "${KEY_PASSWORD:?secret NEXPENSE_KEY_PASSWORD is missing or empty}"
          KEYSTORE="$RUNNER_TEMP/nexpense-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "Decoded keystore: $(wc -c < "$KEYSTORE") bytes"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          {
            printf 'storeFile=%s\n' "$KEYSTORE"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
      - name: Test, lint, and build signed APK
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Name Obtainium asset
        run: cp app/build/outputs/apk/release/app-release.apk nexpense-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: nexpense-release.apk
