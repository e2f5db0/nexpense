name: Test and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure release signing
        run: |
          echo "${{ secrets.NEXPENSE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nexpense-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/nexpense-release.jks"
            echo "storePassword=${{ secrets.NEXPENSE_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.NEXPENSE_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.NEXPENSE_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Test, lint, and build signed APK
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Name Obtainium asset
        run: cp app/build/outputs/apk/release/app-release.apk nexpense-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: nexpense-release.apk
